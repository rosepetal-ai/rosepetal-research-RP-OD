# RP-OD model configuration. Only the architecture lives here: classes come from the dataset and the
# input size is chosen when training. Any key can also be passed as an argument, which wins over this file:
#   RPOD('rpod.yaml', backbone='hgnetv2-b4', neck_size='l', decoder_layers=4)

# The part of the model that looks at the image and extracts its features. It is the heaviest part: a
# bigger one tells hard textures and look-alike classes apart better, but it is slower and needs more
# images to pay off. Start with hgnetv2-b2 and go up only if the model confuses classes or fails on
# difficult backgrounds. hgnetv2-b0 is the light one, hgnetv2-b4 the precise one, hgnetv2-b5 the
# maximum, resnet18 a well-known reference.
#   choices: hgnetv2-b0 | hgnetv2-b2 | hgnetv2-b4 | hgnetv2-b5 | resnet18
backbone: hgnetv2-b2

# Neck: fuses the feature maps of the backbone.
neck:
  # The neck combines what the backbone sees at different scales: fine detail and the big picture. A
  # bigger neck mixes the scales better, which helps when one image holds objects of very different
  # sizes or the background is complex. s is faster; l is more precise.
  #   choices: s | m | l
  size: m

# Decoder: refines every detection, layer by layer.
decoder:
  # How many times the model reviews and corrects each detection. More passes give boxes that fit the
  # object edges more tightly, useful when you need to locate or measure precisely. Each extra pass adds
  # little compute, a bit of latency. More than 6 rarely helps.
  #   choices: 3 | 4 | 5 | 6
  layers: 3
