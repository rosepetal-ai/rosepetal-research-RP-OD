[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpod"
version = "0.2.1"
description = "Real-time object detector: a dense head proposes, a DETR-style decoder refines. No NMS."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only OR LicenseRef-Rosepetal-Enterprise-License"
license-files = ["LICENSE"]
authors = [{name = "Rosepetal AI"}]
keywords = ["object detection", "detr", "real-time", "computer vision", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0.20",
    "numpy",
    "scipy",
    "pyyaml",
    "pillow",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/rosepetal-ai/rosepetal-research-RP-OD"
Issues = "https://github.com/rosepetal-ai/rosepetal-research-RP-OD/issues"

[project.optional-dependencies]
export = ["onnx", "onnxruntime"]
dev = ["pytest", "onnx", "onnxruntime", "pycocotools"]

[tool.setuptools.packages.find]
include = ["rpod*"]

