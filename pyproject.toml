[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rpod"
version = "0.1.0"
description = "Real-time object detector: a dense head proposes, a DETR-style decoder refines. No NMS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0.20",
    "numpy",
    "scipy",
    "pyyaml",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
export = ["onnx", "onnxruntime"]
dev = ["pytest", "onnx", "onnxruntime", "pycocotools"]

[tool.setuptools.packages.find]
include = ["rpod*"]

[tool.setuptools.package-data]
rpod = ["cfg/models/*.yaml"]
